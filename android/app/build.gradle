plugins { id 'com.android.application' }

def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.laqta.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.laqta.app"
        minSdk 29
        targetSdk 34
        versionCode run
        versionName "1.0.$run"
    }
    signingConfigs {
        // Optional fixed key from repository secrets, so new APKs install over old ones.
        // Without the secrets the build falls back to Android's debug key.
        def ks = System.getenv("LAQTA_KEYSTORE_PATH")
        if (ks) {
            laqta {
                storeFile file(ks)
                storePassword System.getenv("LAQTA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("LAQTA_KEY_ALIAS")
                keyPassword System.getenv("LAQTA_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("LAQTA_KEYSTORE_PATH") ? signingConfigs.laqta : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
