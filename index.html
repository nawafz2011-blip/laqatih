<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>لقطة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@700&family=Amiri:wght@700&family=Reem+Kufi:wght@700&family=Changa:wght@700&display=swap">
<style>
/* Layout: editor shell — header / (library | stage | properties) / timeline; on phones the side panels become bottom sheets */
:root{
  --bg:#0e0f13;--panel:#16181f;--panel2:#1d2029;--line:#2a2e3a;--text:#e9ebf1;--mute:#8a90a2;
  --accent:#7c5cff;--accent-soft:#7c5cff26;--accent2:#22d3a6;--pink:#ff5c8a;--warn:#ffb547;--clip-text:#4a2a8a;--clip-audio:#0f3b33;
  --ui:Cairo,Tajawal,"Segoe UI",Tahoma,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;
  --stage:#171a22;--ph:#ffffff;--chip-on:#c9bcff;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9ebf2;--panel:#ffffff;--panel2:#f1f2f7;--line:#d9dce6;--text:#171923;--mute:#5f6678;--accent:#6a48f5;--accent-soft:#6a48f51f;--accent2:#0e9f7a;--clip-text:#6a48f5;--clip-audio:#167a63;--stage:#dfe2ea;--ph:#171923;--chip-on:#5332d6;color-scheme:light}}
:root[data-theme="light"]{--bg:#e9ebf2;--panel:#ffffff;--panel2:#f1f2f7;--line:#d9dce6;--text:#171923;--mute:#5f6678;--accent:#6a48f5;--accent-soft:#6a48f51f;--accent2:#0e9f7a;--clip-text:#6a48f5;--clip-audio:#167a63;--stage:#dfe2ea;--ph:#171923;--chip-on:#5332d6;color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:13px;overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{border-color:#3a3f4e}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);font-weight:700;color:#fff}
button:disabled{opacity:.4;cursor:default}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.tl,header,main{min-width:0}
header{display:flex;align-items:center;gap:10px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--pink));display:grid;place-items:center;font-style:normal;font-size:14px;color:#fff}
.sp{flex:1}
.seg{display:flex;gap:3px;background:var(--panel2);padding:3px;border-radius:9px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--mute);padding:4px 10px;border-radius:6px}
.seg button.on{background:var(--line);color:var(--text)}
main{display:grid;grid-template-columns:270px minmax(0,1fr) 280px;min-height:0}
.panel{background:var(--panel);min-height:0;overflow:auto;padding:14px}
#lib{border-left:1px solid var(--line)}
#props{border-right:1px solid var(--line)}
h3{font-size:13px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
h3 small{color:var(--mute);font-weight:400}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px 10px;text-align:center;color:var(--mute);margin-bottom:12px;cursor:pointer;display:block}
.drop b{color:var(--accent);display:block;font-size:22px;line-height:1}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:16/11;background:var(--panel2) center/cover no-repeat;border:1px solid var(--line);cursor:pointer;padding:0;display:block;width:100%}
.item .ic{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:var(--accent2)}
.item .d{position:absolute;bottom:4px;left:4px;background:#000b;padding:0 5px;border-radius:4px;font-size:10px;direction:ltr;color:#fff}
.item .n{position:absolute;top:4px;right:4px;left:4px;font-size:10px;color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.item .add{position:absolute;bottom:4px;right:4px;width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.tag{font-size:10px;color:var(--warn);border:1px solid #ffb54755;border-radius:4px;padding:0 4px;margin-inline-start:4px}
.stage{display:flex;flex-direction:column;min-height:0;min-width:0;background:radial-gradient(circle at 50% 40%,var(--stage),var(--bg))}
#box{flex:1;min-height:0;display:grid;place-items:center;padding:14px;position:relative}
canvas#cv{border-radius:10px;box-shadow:0 20px 60px #0008;touch-action:none;background:#000;display:block}
.ctrl{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 10px 10px;direction:ltr}
.ctrl button{background:transparent;border:0;color:var(--mute);font-size:16px;padding:6px}
.ctrl #play{width:42px;height:42px;border-radius:50%;background:var(--text);color:var(--bg);justify-content:center;font-size:15px}
.tc{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--mute);min-width:130px;text-align:center}
.tc b{color:var(--text);font-weight:600}
.field{margin-bottom:14px}
.field>label,.lab{display:block;color:var(--mute);font-size:12px;margin-bottom:6px}
textarea,input[type=number],select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit;padding:8px 10px}
textarea{resize:vertical;min-height:64px;font-size:15px}
input[type=range]{width:100%;accent-color:var(--accent)}
.sw{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sw button{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid var(--line)}
.sw button.on{outline:2px solid var(--text);outline-offset:2px}
.sw input[type=color]{width:30px;height:30px;border:0;background:none;padding:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;margin-bottom:14px;background:var(--panel2);padding:3px;border-radius:10px;border:1px solid var(--line)}
.tabs button{flex:1;justify-content:center;border:0;background:transparent;color:var(--mute);padding:6px 0}
.tabs button.on{background:var(--accent);color:#fff;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border-radius:20px;padding:4px 11px;font-size:12px}
.chips button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--chip-on)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.fgrid button,.fup{flex-direction:column;gap:0;padding:8px 2px;justify-content:center;border-radius:10px;min-width:0}
.fgrid button span{font-size:18px;line-height:1.4}
.fgrid small,.fup small{font-family:var(--ui);font-size:10px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fgrid button.on{border-color:var(--accent);background:var(--accent-soft)}
.fup{display:flex;align-items:center;border:1.5px dashed var(--accent);color:var(--chip-on);cursor:pointer;font-weight:700;font-size:12px;text-align:center}
.fup b{font-size:18px;line-height:1.2}
#lib .tabs small{color:inherit;opacity:.8;font-size:10px}
#lib .tabs .sheet-x{flex:0 0 auto;padding:6px 10px}
#libSounds h4{font-size:12px;color:var(--mute);margin:16px 0 4px;font-weight:600}
.snd{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.snd [data-prev]{width:32px;height:32px;border-radius:50%;padding:0;justify-content:center;font-size:11px;flex-shrink:0}
.snd [data-prev].on{background:var(--accent2);border-color:var(--accent2);color:#000}
.snd .nm{flex:1;min-width:0}.snd .nm b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.snd .nm small{color:var(--mute);font-size:10.5px;font-family:var(--mono)}
.snd .addb{background:var(--accent-soft);border-color:transparent;color:var(--chip-on);font-weight:700;padding:5px 10px}
.snd .vt{width:44px;height:32px;border-radius:6px;background:#333 center/cover;flex-shrink:0}
.rec{width:100%;justify-content:center;padding:10px;font-weight:700;border-color:#ff5c8a66;color:#ff8fae}
.rec.on{background:#ff5c8a;color:#fff;border-color:#ff5c8a}
.kfbar{display:flex;gap:6px;margin-bottom:8px}.kfbar #kfTog{flex:1;justify-content:center}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 10px}
.cgrid button{flex-direction:column;padding:4px 2px 3px;gap:1px;border-radius:9px;color:var(--chip-on);min-width:0}
.cgrid svg{width:100%;aspect-ratio:1;overflow:visible}
.cgrid small{font-size:9.5px;color:var(--mute);white-space:nowrap;overflow:hidden;max-width:100%}
.cgrid button.on{border-color:var(--accent);background:var(--accent-soft)}
#cEd{display:block;width:100%;max-width:230px;margin:0 auto 6px;aspect-ratio:130/180;background:var(--panel2);border-radius:12px;touch-action:none;overflow:visible}
.kd{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;background:#ffd36e;border:1.5px solid #222;transform:rotate(45deg);z-index:4;cursor:pointer}
.kd.on{background:#fff;box-shadow:0 0 0 2px var(--accent)}
h4.sec{font-size:12.5px;margin:18px 0 8px}
.trb{position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:6px;padding:0;justify-content:center;font-size:11px;z-index:4;background:var(--panel);color:var(--mute)}
.trb.has{background:var(--accent);color:#fff;border-color:var(--accent)}.trb.on{outline:2px solid var(--ph)}
.tgrid,.flgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.tgrid button,.flgrid button{flex-direction:column;gap:4px;padding:5px 2px;font-size:10.5px;border-radius:9px;min-width:0;justify-content:center}
.tgrid button.on,.flgrid button.on{border-color:var(--accent);background:var(--accent-soft)}
.flgrid span{width:100%;aspect-ratio:1;border-radius:6px;background:#556 center/cover}
.tp{width:100%;aspect-ratio:1.4;border-radius:5px;background:linear-gradient(90deg,#f6a35b 50%,#5ac8fa 50%)}
.tp-none{background:linear-gradient(90deg,#f6a35b 50%,#5ac8fa 50%)}.tp-fade{background:linear-gradient(90deg,#f6a35b,#5ac8fa)}.tp-black{background:linear-gradient(90deg,#f6a35b,#000,#5ac8fa)}.tp-white{background:linear-gradient(90deg,#f6a35b,#fff,#5ac8fa)}
.tp-slideL{background:linear-gradient(90deg,#f6a35b 30%,#5ac8fa 30%)}.tp-slideR{background:linear-gradient(90deg,#5ac8fa 70%,#f6a35b 70%)}.tp-zoom{background:radial-gradient(#f6a35b 30%,#5ac8fa 31%)}.tp-blur{background:linear-gradient(90deg,#f6a35b,#5ac8fa);filter:blur(2px)}
.stk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.stk button{font-size:24px;justify-content:center;padding:6px 0;border-radius:10px}
#pSp{margin:8px 0 4px}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.presets button{justify-content:center;font-size:15px;font-weight:700;padding:8px 0;background-color:var(--panel2)}
.hint{color:var(--mute);line-height:1.8}
.hint kbd{font-family:var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px;direction:ltr;display:inline-block}
/* timeline */
.tl{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;height:262px}
.tbar{display:flex;align-items:center;gap:6px;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tbar button{background:transparent;border-color:transparent;color:var(--mute)}
.tbar button:not(:disabled):hover{background:var(--panel2);color:var(--text)}
.zoom{display:flex;align-items:center;gap:6px;color:var(--mute);margin-inline-start:auto}
.zoom input{width:110px}
.tlwrap{flex:1;display:flex;min-height:0}
.labels{width:84px;flex-shrink:0;border-left:1px solid var(--line);padding-top:26px}
.labels div{height:52px;display:flex;align-items:center;gap:5px;padding:0 12px;color:var(--mute);font-size:12px}
#scroll{flex:1;overflow-x:auto;overflow-y:hidden;position:relative;direction:ltr}
#inner{position:relative;height:100%;min-width:100%}
#ruler{height:26px;border-bottom:1px solid var(--line);position:relative;touch-action:none;cursor:pointer}
#ruler span{position:absolute;top:0;height:100%;border-left:1px solid var(--line);font-size:10px;color:var(--mute);padding:5px 0 0 4px;font-family:var(--mono)}
.lane{height:52px;position:relative;padding:5px 0}
.lane>.in{position:relative;height:100%}
.clip{position:absolute;top:0;bottom:0;border-radius:7px;overflow:hidden;font-size:11px;font-weight:600;color:#fff;cursor:grab;touch-action:none;display:flex;align-items:flex-end;padding:0 10px 3px;border:1px solid #ffffff2a;user-select:none}
.clip .lbl{position:relative;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.clip.v{background-color:#333;background-size:auto 100%;background-repeat:repeat-x}
.clip.t{background:var(--clip-text);border-color:#7c5cff88;align-items:center}
.clip.a{background-color:var(--clip-audio);border-color:#22d3a655;background-repeat:no-repeat}
.clip.sel{outline:2px solid var(--ph);outline-offset:-1px;z-index:2}
.clip.drag{opacity:.85;z-index:5;box-shadow:0 6px 20px #000a}
.clip .h{position:absolute;top:0;bottom:0;width:10px;background:#fff0;cursor:ew-resize;z-index:3}
.clip.sel .h{background:var(--ph)}
.clip .h.l{left:0}.clip .h.r{right:0}
.clip .h::after{content:"";position:absolute;top:35%;bottom:35%;left:4px;width:2px;background:#0008;border-radius:2px}
#ph{position:absolute;top:0;bottom:0;width:2px;background:var(--ph);z-index:6;pointer-events:none;left:0}
#ph::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:9px solid var(--ph)}
.empty-lane{position:absolute;inset:5px 8px;border:1px dashed var(--line);border-radius:7px;display:flex;align-items:center;padding:0 10px;color:var(--mute);font-size:11px;pointer-events:none;direction:rtl}
/* overlays */
.ov{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(380px,100%);text-align:center}
.card h2{margin:0 0 6px;font-size:18px}
.card p{color:var(--mute);margin:0 0 16px;line-height:1.7}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.card video{width:100%;max-height:260px;border-radius:10px;background:#000;margin-bottom:14px}
.card .row{justify-content:center}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:10px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.mob{display:none}
.scrim{display:none}
@media (max-width:899px){
  header{gap:6px}
  header .proj,#ratioTop{display:none}
  main{grid-template-columns:1fr}
  .panel{position:fixed;left:0;right:0;bottom:0;max-height:62%;z-index:40;border:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .25s;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px #000a}
  .panel.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:#0007;z-index:39}
  .grid{grid-template-columns:repeat(3,1fr)}
  .tl{height:232px}
  .lane{height:46px}.labels div{height:46px}
  .labels{width:58px}.labels div{padding:0 8px;font-size:11px}
  .zoom{display:none}
  .mob{display:inline-flex}
  .ctrl{gap:8px}
  .tc{min-width:110px}
  .sheet-x{display:inline-flex}
}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
</style>

<div class="app">
  <header>
    <div class="logo"><i>✦</i> لقطة</div>
    <span class="proj hint" id="projInfo"></span>
    <div class="sp"></div>
    <div class="seg" id="ratioTop"></div>
    <button id="themeBtn" aria-label="تبديل الوضع">☀</button>
    <button id="undo" title="تراجع (Ctrl+Z)">↶</button>
    <button id="redo" title="إعادة (Ctrl+Shift+Z)">↷</button>
    <button class="primary" id="exportBtn">⬇ تصدير</button>
  </header>
  <main>
    <aside class="panel" id="lib">
      <div class="tabs"><button data-libtab="files" class="on">ملفاتي <small id="libCount"></small></button><button data-libtab="sounds">♫ صوتيات</button><button data-libtab="stickers">✿ ستيكرات</button><button class="mob sheet-x" data-close>✕</button></div>
      <div id="libFiles">
        <label class="drop" id="drop"><b>+</b>اسحب فيديو أو صور أو صوت هنا، أو اضغط للاختيار
          <input type="file" id="file" multiple accept="video/*,image/*,audio/*" hidden>
        </label>
        <div class="grid" id="libGrid"></div>
      </div>
      <div id="libSounds" hidden></div>
      <div id="libStk" hidden></div>
    </aside>
    <section class="stage">
      <div id="box"><canvas id="cv"></canvas></div>
      <div class="ctrl">
        <button id="toStart" title="البداية">⏮</button>
        <button id="back" title="رجوع ثانية">◀◀</button>
        <button id="play" title="تشغيل (Space)">▶</button>
        <button id="fwd" title="تقديم ثانية">▶▶</button>
        <span class="tc" id="tc"></span>
      </div>
    </section>
    <aside class="panel" id="props"></aside>
  </main>
  <section class="tl">
    <div class="tbar">
      <button class="mob" id="mLib">▣ الوسائط</button>
      <button id="addText">T نص</button>
      <button id="addSound">♫ صوت</button>
      <button id="addStk">✿ ستيكر</button>
      <button id="kfBtn" title="كي فريم (K)">◆ كي فريم</button>
      <button id="split" title="تقسيم عند المؤشر (S)">✂ تقسيم</button>
      <button id="dup">⧉ تكرار</button>
      <button id="del" title="حذف (Delete)">⌫ حذف</button>
      <button class="mob" id="mProps">⚙ تعديل</button>
      <div class="zoom">− <input type="range" id="zoom" min="15" max="300" value="70" aria-label="تكبير الخط الزمني"> +</div>
    </div>
    <div class="tlwrap">
      <div class="labels"><div>T نص</div><div>▣ فيديو</div><div>♫ صوت</div></div>
      <div id="scroll"><div id="inner">
        <div id="ruler"></div>
        <div class="lane"><div class="in" id="laneT"></div></div>
        <div class="lane"><div class="in" id="laneM"></div></div>
        <div class="lane"><div class="in" id="laneA"></div></div>
        <div id="ph"></div>
      </div></div>
    </div>
  </section>
</div>
<input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2" hidden>
<div class="scrim" id="scrim"></div>
<div class="ov" id="ov" hidden><div class="card" id="ovCard"></div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const RATIOS={'9:16':[720,1280],'16:9':[1280,720],'1:1':[900,900],'4:5':[864,1080]};
const FONTS=[['Cairo','كايرو'],['Tajawal','تجوال'],['Amiri','أميري'],['Reem Kufi','ريم كوفي'],['Changa','تشانجا']];
const COLORS=['#ffffff','#ffd36e','#ff5c8a','#7c5cff','#22d3a6','#5ac8fa','#000000'];
const media=new Map();

function renderTimeline(){

  const steps=[.5,1,2,5,10,15,30,60,120],step=steps.find(s=>s*pps>=64)||120;let r='';

  layout();
  const cls=(k,id)=>sel&&sel.k===k&&sel.id===id?' sel':'';
  const hd='<i class="h l"></i><i class="h r"></i>';
  const kd=(it,k)=>(it.kf||[]).map((f,i)=>`<i class="kd${Math.abs(f.t-(time-itemStart(k,it)))<KTOL?' on':''}" data-kt="${itemStart(k,it)+f.t}" style="left:${f.t*pps}px"></i>`).join('');
  $('#laneM').innerHTML=P.main.map(c=>{const m=media.get(c.mid)||{};return `<div class="clip v${cls('m',c.id)}" data-k="m" data-id="${c.id}" style="left:${c._s*pps}px;width:${dur(c)*pps}px;background-image:url('${m.thumb||''}')">${hd}${kd(c,'m')}<span class="lbl">${esc(m.name||'')} · ${dur(c).toFixed(1)}ث</span></div>`}).join('')||'<div class="empty-lane">اضغط + على أي فيديو أو صورة في الوسائط</div>';
  $('#laneM').insertAdjacentHTML('beforeend',P.main.slice(0,-1).map(c=>`<button class="trb${c.tr&&c.tr.type!=='none'?' has':''}${sel&&sel.k==='tr'&&sel.id===c.id?' on':''}" data-tr="${c.id}" style="left:${(c._s+dur(c))*pps-11}px" title="انتقال">⇄</button>`).join(''));
  $('#laneT').innerHTML=P.texts.map(t=>`<div class="clip t${cls('t',t.id)}" data-k="t" data-id="${t.id}" style="left:${t.start*pps}px;width:${t.dur*pps}px">${hd}${kd(t,'t')}<span class="lbl">${esc(t.text)}</span></div>`).join('');
  const ends=[];[...P.audios].sort((a,b)=>a.start-b.start).forEach(a=>{let r=ends.findIndex(e=>e<=a.start+.01);if(r<0)r=ends.length<3?ends.length:2;ends[r]=a.start+dur(a);a._row=r});const R=Math.max(1,ends.length);
  $('#laneA').innerHTML=P.audios.map(a=>{const m=media.get(a.mid)||{};return `<div class="clip a${cls('a',a.id)}" data-k="a" data-id="${a.id}" style="top:calc(${a._row}*100%/${R});height:calc(100%/${R} - ${R>1?2:0}px);bottom:auto;left:${a.start*pps}px;width:${dur(a)*pps}px;background-image:url('${m.wave||''}');background-size:${(m.duration||1)*pps}px 70%;background-position:${-a.in*pps}px center">${hd}<span class="lbl">♫ ${esc(m.name||'')}</span></div>`}).join('');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let drag=null;
$('#inner').addEventListener('pointerdown',e=>{
  if(exporting)return;ensureAudio();
  const ix=()=>e.clientX-$('#inner').getBoundingClientRect().left;
  const trb=e.target.closest('.trb');if(trb){sel={k:'tr',id:trb.dataset.tr};refresh();openSheet('props');return}
  const kdi=e.target.closest('.kd');if(kdi){const c=kdi.closest('.clip');sel={k:c.dataset.k,id:c.dataset.id};pause();seek(+kdi.dataset.kt);refresh();return}
  const el=e.target.closest('.clip');
  if(!el){
    if(e.target.closest('#ruler')||e.pointerType==='mouse'){drag={type:'scrub'};pause();seek(ix()/pps);if(sel){sel=null;refresh()}}
    else{drag=null;if(e.pointerType!=='mouse'){/* tap on empty lane seeks */const x=ix();const up=()=>{seek(x/pps);window.removeEventListener('pointerup',up)};window.addEventListener('pointerup',up)}return}
  }else{

    const h=e.target.closest('.h');layout();
    drag={type:h?(h.classList.contains('l')?'L':'R'):'move',k,item,x0:e.clientX,snap:{...item},moved:false};refresh();
  }

});
function onDrag(e){
  if(!drag)return;
  if(drag.type==='scrub'){seek((e.clientX-$('#inner').getBoundingClientRect().left)/pps);return}
  const px=e.clientX-drag.x0;if(!drag.moved){if(Math.abs(px)<3)return;commit();drag.moved=true}
  const d=px/pps,{item:it,snap:s,k}=drag,m=media.get(it.mid),maxD=m&&m.type!=='image'?m.duration:1e9;
  if(drag.type==='move'){
    if(k==='m'){renderTimeline();const el=document.querySelector(`.clip[data-id="${it.id}"]`);if(el){el.classList.add('drag');el.style.transform=`translateX(${px}px)`}drag.px=px;return}
    it.start=Math.max(0,+(s.start+d).toFixed(3));
  }else if(drag.type==='L'){
    if(k==='t'){const nd=clamp(s.dur-d,.2,s.start+s.dur);it.start=s.start+s.dur-nd;it.dur=nd}
    else if(m.type==='image'){it.out=clamp(s.out-d,.2,600)}
    else{const sp=s.speed||1;it.in=clamp(s.in+d*sp,0,s.out-.1);if(k==='a'){it.start=Math.max(0,s.start+(it.in-s.in)/sp)}}
  }else{
    if(k==='t')it.dur=Math.max(.2,s.dur+d);else if(m.type==='image')it.out=clamp(s.out+d,.2,600);else it.out=clamp(s.out+d*(s.speed||1),it.in+.1,maxD);
  }
  renderTimeline();
}
function endDrag(){
  window.removeEventListener('pointermove',onDrag);
  if(drag&&drag.type==='move'&&drag.k==='m'&&drag.moved){
    const it=drag.item,center=drag.snap._s+dur(it)/2+(drag.px||0)/pps;
    P.main.splice(P.main.indexOf(it),1);layout();let i=P.main.findIndex(c=>c._s+dur(c)/2>center);if(i<0)i=P.main.length;P.main.splice(i,0,it);
  }
  drag=null;refresh();
}

    ${m.type==='image'?`<div class="field"><label for="pDur">المدة (ثانية)</label><input type="number" id="pDur" min="0.2" step="0.1" value="${dur(s).toFixed(1)}"></div>`:''}
    ${sel.k==='m'&&m.type==='video'?`<h4 class="sec">⏱ السرعة · <span id="pSpV">${(s.speed||1)}x</span></h4><div class="chips">${[.25,.5,1,1.5,2,3].map(v=>`<button data-sp="${v}" class="${(s.speed||1)===v?'on':''}">${v}x</button>`).join('')}</div><input type="range" id="pSp" min="0.1" max="4" step="0.05" value="${s.speed||1}" aria-label="السرعة">`:''}
    ${sel.k==='m'?`<h4 class="sec">◐ فلتر</h4><div class="flgrid">${FILTERS.map(([k,n,f])=>`<button data-flt="${k}" class="${(s.filter||'none')===k?'on':''}"><span style="background-image:url('${m.thumb||''}');filter:${f||'none'}"></span>${n}</button>`).join('')}</div>
    ${[['aB','b','السطوع',.3,1.8],['aC','c','التباين',.3,1.8],['aS','s','التشبع',0,2.5]].map(([id,k,n,mn,mx])=>`<div class="field"><label for="${id}">${n} · <span id="${id}V">${Math.round(((s.adj||{})[k]??1)*100)}%</span></label><input type="range" id="${id}" data-adj="${k}" min="${mn}" max="${mx}" step="0.01" value="${(s.adj||{})[k]??1}"></div>`).join('')}
    <h4 class="sec">◆ كي فريم وتحريك المقطع</h4>${kfPanel(s,'m')}`:''}
    ${sel.k==='m'&&m.type==='video'?`<div class="field"><button id="pExt">♫ استخراج الصوت</button><p class="hint" style="margin:6px 0 0">ينقل صوت المقطع لمسار الصوت ويكتم الأصلي، عشان تقصه أو تحركه لحاله.</p></div>`:''}
    ${sel.k==='a'?`<div class="field"><label for="pFin">ظهور تدريجي · <span id="pFinV">${(s.fin||0).toFixed(1)} ث</span></label><input type="range" id="pFin" min="0" max="${Math.min(5,dur(s)/2).toFixed(1)}" step="0.1" value="${s.fin||0}"></div>
    <div class="field"><label for="pFout">اختفاء تدريجي · <span id="pFoutV">${(s.fout||0).toFixed(1)} ث</span></label><input type="range" id="pFout" min="0" max="${Math.min(5,dur(s)/2).toFixed(1)}" step="0.1" value="${s.fout||0}"></div>`:''}
    <p class="hint">اسحب أطراف المقطع في الخط الزمني عشان تقصّه${sel.k==='m'?'، واسحبه كامل عشان تغيّر ترتيبه':''}.</p>`;
  let c=0;const once=()=>{if(!c){commit();c=1}};
  const pv=$('#pVol');if(pv){pv.addEventListener('pointerdown',once);pv.addEventListener('input',e=>{once();s.vol=+e.target.value;$('#pVolV').textContent=Math.round(s.vol*100)+'%'})}
  el.querySelectorAll('[data-fit]').forEach(b=>b.onclick=()=>{commit();s.fit=b.dataset.fit;renderProps()});
  const px=$('#pExt');if(px)px.onclick=()=>extractAudio(s);
  if(sel.k==='m')bindKf(s,'m');
  el.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{commit();s.speed=+b.dataset.sp;refresh()});
  const sp=$('#pSp');if(sp){sp.addEventListener('pointerdown',once);sp.addEventListener('input',e=>{once();s.speed=+e.target.value;$('#pSpV').textContent=s.speed+'x';renderTimeline()});sp.addEventListener('change',()=>refresh())}
  el.querySelectorAll('[data-flt]').forEach(b=>b.onclick=()=>{commit();s.filter=b.dataset.flt;renderProps()});
  el.querySelectorAll('[data-adj]').forEach(r=>{r.addEventListener('pointerdown',once);r.addEventListener('input',e=>{once();s.adj={...(s.adj||{}),[r.dataset.adj]:+e.target.value};$('#'+r.id+'V').textContent=Math.round(+e.target.value*100)+'%'})});
  [['pFin','fin'],['pFout','fout']].forEach(([id,k])=>{const r=$('#'+id);if(!r)return;r.addEventListener('pointerdown',once);r.addEventListener('input',e=>{once();s[k]=+e.target.value;$('#'+id+'V').textContent=s[k].toFixed(1)+' ث'})});
  const pd=$('#pDur');if(pd)pd.onchange=e=>{commit();s.out=s.in+Math.max(.2,+e.target.value||3);refresh()};
}
function previewAnim(t,end){const keep=sel;sel=null;seek(end?Math.max(t.start,t.start+t.dur-1.2):t.start);play();
  const stop=end?t.start+t.dur:Math.min(t.start+t.dur,t.start+1.6);const chk=()=>{if(!playing){sel=keep;return}if(time>=stop-.01){pause();sel=keep;seek(end?t.start+t.dur-.01:Math.min(stop,t.start+t.dur-.01));return}requestAnimationFrame(chk)};requestAnimationFrame(chk)}
document.getElementById('fontFile').addEventListener('change',e=>{const f=e.target.files[0];if(f)addFont(f);e.target.value=''});
function ratioBtns(){return Object.keys(RATIOS).map(r=>`<button data-ratio="${r}" class="${r===P.ratio?'on':''}">${r}</button>`).join('')}
document.addEventListener('click',e=>{const r=e.target.closest('[data-ratio]');if(r){setRatio(r.dataset.ratio);refresh()}if(e.target.closest('[data-close]'))closeSheets()});
function refresh(){renderTimeline();renderProps();updBtns();refreshInfo()}
function openSheet(id){if(matchMedia('(max-width:899px)').matches){closeSheets();$('#'+id).classList.add('open');$('#scrim').classList.add('open')}}
function closeSheets(){document.querySelectorAll('.panel.open').forEach(p=>p.classList.remove('open'));$('#scrim').classList.remove('open')}
$('#scrim').onclick=closeSheets;$('#mLib').onclick=()=>{libTab='files';renderLib();openSheet('lib')};
$('#addStk').onclick=()=>{libTab='stickers';renderLib();openSheet('lib')};
$('#addSound').onclick=()=>{libTab='sounds';renderLib();openSheet('lib')};$('#mProps').onclick=()=>openSheet('props');

/* ---------- import UI ---------- */
$('#file').addEventListener('change',e=>{addFiles([...e.target.files]);e.target.value=''});
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.add('over')}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.remove('over')}));

/* ---------- transport & keys ---------- */
$('#play').onclick=()=>playing?pause():play();
$('#toStart').onclick=()=>seek(0);$('#back').onclick=()=>seek(time-1);$('#fwd').onclick=()=>seek(time+1);
$('#addText').onclick=addText;
$('#kfBtn').onclick=kfToggle;
function kfToggle(){const s=getSel();if(!s||sel.k==='a')return toast('اختر نص أو مقطع فيديو أول');commit();const t=lt(sel.k,s),h=kfAt(s,t);if(h){s.kf.splice(s.kf.indexOf(h),1);toast('تم حذف الكي فريم')}else{addKf(s,t);toast('تمت إضافة كي فريم ◆')}if(sel.k==='t')$('#props')._tab='kf';refresh();openSheet('props')}
function applyTheme(th){document.documentElement.setAttribute('data-theme',th);const b=$('#themeBtn');b.textContent=th==='dark'?'☀':'☾';b.title=th==='dark'?'الوضع الصباحي':'الوضع الليلي'}
{let th0=null;try{th0=localStorage.getItem('laqta-theme')}catch(e){}applyTheme(th0||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'))}
$('#themeBtn').onclick=()=>{const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';applyTheme(n);try{localStorage.setItem('laqta-theme',n)}catch(e){}};$('#split').onclick=split;$('#del').onclick=del;$('#dup').onclick=dup;$('#undo').onclick=undo;$('#redo').onclick=redo;
document.addEventListener('keydown',e=>{
  if(exporting||e.target.matches('textarea,input,select'))return;
  const z=e.key.toLowerCase();
  if(e.code==='Space'){e.preventDefault();playing?pause():play()}
  else if((e.ctrlKey||e.metaKey)&&z==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if((e.ctrlKey||e.metaKey)&&z==='y'){e.preventDefault();redo()}
  else if(z==='s'&&!e.ctrlKey&&!e.metaKey)split();
  else if(z==='k'&&!e.ctrlKey&&!e.metaKey)kfToggle();
  else if(e.key==='Delete'||e.key==='Backspace')del();
  else if(e.key==='ArrowLeft')seek(time-(e.shiftKey?1:1/30));else if(e.key==='ArrowRight')seek(time+(e.shiftKey?1:1/30));
});
document.addEventListener('pointerdown',ensureAudio,{once:true});

/* ---------- export ---------- */
function pickMime(){return['video/mp4;codecs=avc1.42E01F,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||''}
function showOv(html){$('#ovCard').innerHTML=html;$('#ov').hidden=false}
function hideOv(){$('#ov').hidden=true;$('#ovCard').innerHTML=''}
async function startExport(){
  if(!P.main.length&&!P.texts.length)return toast('أضف مقطع أول قبل التصدير');
  if(!window.MediaRecorder||!cv.captureStream)return toast('متصفحك ما يدعم التصدير. جرّب Chrome أو Edge');
  ensureAudio();pause();const prevSel=sel;sel=null;seek(0);sync();
  await new Promise(r=>setTimeout(r,400));
  const mime=pickMime(),stream=cv.captureStream(30);
  if(adest)adest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  let rec;try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:8e6}:{})}catch(e){sel=prevSel;return toast('تعذّر بدء التصدير')}
  const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  exporting={rec,chunks,mime:rec.mimeType||mime,cancelled:false,prevSel};
  showOv(`<h2>جاري التصدير…</h2><p>خلّ الصفحة مفتوحة لين يخلص. التصدير ياخذ نفس مدة الفيديو تقريباً.</p><div class="bar"><i id="expBar"></i></div><p id="expPct" style="font-family:var(--mono)">0%</p><div class="row"><button id="expCancel">إلغاء</button></div>`);
  $('#expCancel').onclick=()=>{exporting.cancelled=true;finishExport()};
  rec.onstop=()=>{const ex=exporting;exporting=null;sel=ex.prevSel;
    if(ex.cancelled){hideOv();toast('تم إلغاء التصدير');refresh();return}
    const blob=new Blob(ex.chunks,{type:ex.mime.split(';')[0]||'video/webm'}),ext=/mp4/.test(ex.mime)?'mp4':'webm',url=URL.createObjectURL(blob),name=`laqta-${new Date().toISOString().slice(0,10)}.${ext}`;
    showOv(`<h2>الفيديو جاهز ✓</h2><video src="${url}" controls playsinline></video><p>${ext.toUpperCase()} · ${(blob.size/1048576).toFixed(1)} MB</p><div class="row"><button class="primary" id="saveV">⬇ حفظ الفيديو</button><button id="closeV">رجوع للتحرير</button></div>`);
    $('#closeV').onclick=()=>{hideOv();URL.revokeObjectURL(url)};
    $('#saveV').onclick=async()=>{
      if(dl){try{await dl.save({filename:name,data:blob});toast('تم الحفظ')}catch(e){if(e&&e.code!=='declined')toast('ما قدرنا نحفظ الملف هنا')}}
      else{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
    };refresh();
  };
  rec.start(250);play();
}
function finishExport(){if(!exporting||exporting.stopping)return;exporting.stopping=true;pause();try{exporting.rec.stop()}catch(e){}}
$('#exportBtn').onclick=startExport;

/* ---------- sample project so the editor opens in a working state ---------- */
function sampleImage(name,stops,sun){
  const c=document.createElement('canvas');c.width=720;c.height=1280;const x=c.getContext('2d');const gr=x.createLinearGradient(0,0,0,1280);stops.forEach((s,i)=>gr.addColorStop(i/(stops.length-1),s));x.fillStyle=gr;x.fillRect(0,0,720,1280);
  x.fillStyle=sun;x.shadowColor=sun;x.shadowBlur=120;x.beginPath();x.arc(360,560,150,0,7);x.fill();x.shadowBlur=0;
  x.fillStyle='#1b0f2c';x.beginPath();x.moveTo(0,1000);x.lineTo(150,900);x.lineTo(330,1010);x.lineTo(520,880);x.lineTo(720,960);x.lineTo(720,1280);x.lineTo(0,1280);x.fill();
  const url=c.toDataURL('image/jpeg',.85),img=new Image();img.src=url;const bin=atob(url.split(',')[1]),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  const m={id:uid(),type:'image',name,url,el:img,duration:3,thumb:url,sample:true,file:new File([u8],name,{type:'image/jpeg'})};media.set(m.id,m);persistMedia(m);return m;
}
/* ---------- autosave (IndexedDB, stays in this browser) ---------- */
const DB={db:null,
  open(){if(this.db)return this.db;return this.db=new Promise((res,rej)=>{const q=indexedDB.open('laqta',1);q.onupgradeneeded=()=>{const d=q.result;['kv','media','fonts'].forEach(n=>d.createObjectStore(n))};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async tx(st,mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(st,mode),o=t.objectStore(st),q=fn(o);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})},
  put(st,k,v){return this.tx(st,'readwrite',o=>o.put(v,k))},get(st,k){return this.tx(st,'readonly',o=>o.get(k))},
  async all(st){const d=await this.open();return new Promise((res,rej)=>{const out=[],q=d.transaction(st).objectStore(st).openCursor();q.onsuccess=()=>{const c=q.result;if(c){out.push(c.value);c.continue()}else res(out)};q.onerror=()=>rej(q.error)})},
  clear(){return Promise.all(['kv','media','fonts'].map(n=>this.tx(n,'readwrite',o=>o.clear())))}};
function persistMedia(m){const rec={id:m.id,type:m.type,name:m.name,duration:m.duration,lib:!!m.lib,sample:!!m.sample,soundKey:m.soundKey||null,srcOf:m.srcOf||null,wave:m.srcOf?m.wave:null,blob:m.srcOf?null:m.file};DB.put('media',m.id,rec).catch(()=>{})}
async function restore(){
  try{
    const pj=await DB.get('kv','project');if(!pj)return false;
    for(const f of await DB.all('fonts')){try{const ff=new FontFace(f.fam,f.buf.slice(0));await ff.load();document.fonts.add(ff);customFonts.push([f.fam,f.label,true])}catch(e){}}
    const recs=await DB.all('media'),later=[];
    for(const r of recs){if(r.srcOf){later.push(r);continue}if(!r.blob)continue;
      const f=r.blob instanceof File?r.blob:new File([r.blob],r.name,{type:r.blob.type});
      const m=await makeMedia(f,{id:r.id,lib:r.lib,sample:r.sample,soundKey:r.soundKey,duration:r.duration});
      if(m){media.set(m.id,m);if(r.soundKey)soundCache[r.soundKey]=m}}
    for(const r of later){const v=media.get(r.srcOf);if(!v)continue;media.set(r.id,{id:r.id,type:'audio',name:r.name,url:v.url,file:v.file,duration:r.duration,wave:r.wave,lib:true,srcOf:r.srcOf});v.audioMedia=r.id}
    P=JSON.parse(pj);P.main=P.main.filter(c=>media.has(c.mid));P.audios=P.audios.filter(a=>media.has(a.mid));return true;
  }catch(e){return false}
}
let lastSaved='',saveOK=true;
setInterval(()=>{const j=JSON.stringify(P,(k,v)=>k[0]==='_'?undefined:v);if(j===lastSaved)return;lastSaved=j;DB.put('kv','project',j).then(()=>{saveOK=true;$('#projInfo').dataset.saved='1';refreshInfo()}).catch(()=>{saveOK=false;refreshInfo()})},1500);
function refreshInfo(){$('#projInfo').textContent=`${P.main.length} مقاطع · ${fmt(total(),false)}${saveOK?' · محفوظ تلقائياً ✓':' · الحفظ غير متاح هنا'}`}
async function newProject(){pause();await DB.clear().catch(()=>{});media.clear();clipP.clear();for(const k in soundCache)delete soundCache[k];customFonts=[];hist=[];fut=[];sel=null;time=0;P={ratio:P.ratio,main:[],texts:[],audios:[]};renderLib();refresh();toast('بدأت مشروع جديد')}
function freshSample(){
  const a=sampleImage('غروب.jpg',['#f6a35b','#e0607a','#7a2f6e','#1e1236'],'#ffe2a8'),b=sampleImage('ليل.jpg',['#5ac8fa','#1d5f8a','#0d2b3e','#08121c'],'#f4f1ff');
  P.main.push({id:uid(),mid:a.id,in:0,out:4,vol:1,fit:'cover'},{id:uid(),mid:b.id,in:0,out:3,vol:1,fit:'cover'});
  P.texts.push(norm({id:uid(),text:'لحظة الغروب ✨',start:.3,dur:3.4,size:60,color:'#ffffff',font:'Cairo',weight:800,x:.5,y:.18,bg:false,ain:'type',aout:'fade'}),norm({id:uid(),text:'وجاء الليل 🌙',start:4.2,dur:2.6,size:52,color:'#5ac8fa',font:'Reem Kufi',x:.5,y:.8,bg:false,glow:true,shadow:1,ain:'pop',aout:'zoom'}));
}
(async function init(){
  $('#ratioTop').innerHTML=ratioBtns();
  const ok=await restore();if(!ok)freshSample();
  setRatio(P.ratio||'9:16',false);renderLib();refresh();
  if(ok)toast('تم استرجاع مشروعك ✓');
  if(document.fonts)FONTS.forEach(([f])=>document.fonts.load(`700 40px "${f}"`));
  requestAnimationFrame(loop);
})();
