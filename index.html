<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

</head>
<body>
<title>لقطة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@700&family=Amiri:wght@700&family=Reem+Kufi:wght@700&family=Changa:wght@700&display=swap">
<style>
/* Layout: editor shell — header / (library | stage | properties) / timeline; on phones the side panels become bottom sheets */
:root{
  --bg:#0e0f13;--panel:#16181f;--panel2:#1d2029;--line:#2a2e3a;--text:#e9ebf1;--mute:#8a90a2;
  --accent:#7c5cff;--accent-soft:#7c5cff26;--accent2:#22d3a6;--pink:#ff5c8a;--warn:#ffb547;--clip-text:#4a2a8a;--clip-audio:#0f3b33;
  --ui:Cairo,Tajawal,"Segoe UI",Tahoma,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;
  --stage:#171a22;--ph:#ffffff;--chip-on:#c9bcff;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9ebf2;--panel:#ffffff;--panel2:#f1f2f7;--line:#d9dce6;--text:#171923;--mute:#5f6678;--accent:#6a48f5;--accent-soft:#6a48f51f;--accent2:#0e9f7a;--clip-text:#6a48f5;--clip-audio:#167a63;--stage:#dfe2ea;--ph:#171923;--chip-on:#5332d6;color-scheme:light}}
:root[data-theme="light"]{--bg:#e9ebf2;--panel:#ffffff;--panel2:#f1f2f7;--line:#d9dce6;--text:#171923;--mute:#5f6678;--accent:#6a48f5;--accent-soft:#6a48f51f;--accent2:#0e9f7a;--clip-text:#6a48f5;--clip-audio:#167a63;--stage:#dfe2ea;--ph:#171923;--chip-on:#5332d6;color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:13px;overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{border-color:#3a3f4e}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);font-weight:700;color:#fff}
button:disabled{opacity:.4;cursor:default}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.tl,header,main{min-width:0}
header{display:flex;align-items:center;gap:10px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--pink));display:grid;place-items:center;font-style:normal;font-size:14px;color:#fff}
.sp{flex:1}
.seg{display:flex;gap:3px;background:var(--panel2);padding:3px;border-radius:9px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--mute);padding:4px 10px;border-radius:6px}
.seg button.on{background:var(--line);color:var(--text)}
main{display:grid;grid-template-columns:270px minmax(0,1fr) 280px;min-height:0}
.panel{background:var(--panel);min-height:0;overflow:auto;padding:14px}
#lib{border-left:1px solid var(--line)}
#props{border-right:1px solid var(--line)}
h3{font-size:13px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
h3 small{color:var(--mute);font-weight:400}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px 10px;text-align:center;color:var(--mute);margin-bottom:12px;cursor:pointer;display:block}
.drop b{color:var(--accent);display:block;font-size:22px;line-height:1}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:16/11;background:var(--panel2) center/cover no-repeat;border:1px solid var(--line);cursor:pointer;padding:0;display:block;width:100%}
.item .ic{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:var(--accent2)}
.item .d{position:absolute;bottom:4px;left:4px;background:#000b;padding:0 5px;border-radius:4px;font-size:10px;direction:ltr;color:#fff}
.item .n{position:absolute;top:4px;right:4px;left:4px;font-size:10px;color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.item .add{position:absolute;bottom:4px;right:4px;width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.tag{font-size:10px;color:var(--warn);border:1px solid #ffb54755;border-radius:4px;padding:0 4px;margin-inline-start:4px}
.stage{display:flex;flex-direction:column;min-height:0;min-width:0;background:radial-gradient(circle at 50% 40%,var(--stage),var(--bg))}
#box{flex:1;min-height:0;display:grid;place-items:center;padding:14px;position:relative}
canvas#cv{border-radius:10px;box-shadow:0 20px 60px #0008;touch-action:none;background:#000;display:block}
.ctrl{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 10px 10px;direction:ltr}
.ctrl button{background:transparent;border:0;color:var(--mute);font-size:16px;padding:6px}
.ctrl #play{width:42px;height:42px;border-radius:50%;background:var(--text);color:var(--bg);justify-content:center;font-size:15px}
.tc{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--mute);min-width:130px;text-align:center}
.tc b{color:var(--text);font-weight:600}
.field{margin-bottom:14px}
.field>label,.lab{display:block;color:var(--mute);font-size:12px;margin-bottom:6px}
textarea,input[type=number],select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit;padding:8px 10px}
textarea{resize:vertical;min-height:64px;font-size:15px}
input[type=range]{width:100%;accent-color:var(--accent)}
.sw{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sw button{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid var(--line)}
.sw button.on{outline:2px solid var(--text);outline-offset:2px}
.sw input[type=color]{width:30px;height:30px;border:0;background:none;padding:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;margin-bottom:14px;background:var(--panel2);padding:3px;border-radius:10px;border:1px solid var(--line)}
.tabs button{flex:1;justify-content:center;border:0;background:transparent;color:var(--mute);padding:6px 0}
.tabs button.on{background:var(--accent);color:#fff;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border-radius:20px;padding:4px 11px;font-size:12px}
.chips button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--chip-on)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.fgrid button,.fup{flex-direction:column;gap:0;padding:8px 2px;justify-content:center;border-radius:10px;min-width:0}
.fgrid button span{font-size:18px;line-height:1.4}
.fgrid small,.fup small{font-family:var(--ui);font-size:10px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fgrid button.on{border-color:var(--accent);background:var(--accent-soft)}
.fup{display:flex;align-items:center;border:1.5px dashed var(--accent);color:var(--chip-on);cursor:pointer;font-weight:700;font-size:12px;text-align:center}
.fup b{font-size:18px;line-height:1.2}
#lib .tabs small{color:inherit;opacity:.8;font-size:10px}
#lib .tabs .sheet-x{flex:0 0 auto;padding:6px 10px}
#libSounds h4{font-size:12px;color:var(--mute);margin:16px 0 4px;font-weight:600}
.snd{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.snd [data-prev]{width:32px;height:32px;border-radius:50%;padding:0;justify-content:center;font-size:11px;flex-shrink:0}
.snd [data-prev].on{background:var(--accent2);border-color:var(--accent2);color:#000}
.snd .nm{flex:1;min-width:0}.snd .nm b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.snd .nm small{color:var(--mute);font-size:10.5px;font-family:var(--mono)}
.snd .addb{background:var(--accent-soft);border-color:transparent;color:var(--chip-on);font-weight:700;padding:5px 10px}
.snd .vt{width:44px;height:32px;border-radius:6px;background:#333 center/cover;flex-shrink:0}
.rec{width:100%;justify-content:center;padding:10px;font-weight:700;border-color:#ff5c8a66;color:#ff8fae}
.rec.on{background:#ff5c8a;color:#fff;border-color:#ff5c8a}
.kfbar{display:flex;gap:6px;margin-bottom:8px}.kfbar #kfTog{flex:1;justify-content:center}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 10px}
.cgrid button{flex-direction:column;padding:4px 2px 3px;gap:1px;border-radius:9px;color:var(--chip-on);min-width:0}
.cgrid svg{width:100%;aspect-ratio:1;overflow:visible}
.cgrid small{font-size:9.5px;color:var(--mute);white-space:nowrap;overflow:hidden;max-width:100%}
.cgrid button.on{border-color:var(--accent);background:var(--accent-soft)}
#cEd{display:block;width:100%;max-width:230px;margin:0 auto 6px;aspect-ratio:130/180;background:var(--panel2);border-radius:12px;touch-action:none;overflow:visible}
.kd{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;background:#ffd36e;border:1.5px solid #222;transform:rotate(45deg);z-index:4;cursor:pointer}
.kd::after{content:"";position:absolute;inset:-9px}/* bigger tap area */
@media (pointer:coarse){.kd{width:14px;height:14px;margin:-7px 0 0 -7px}.kd::after{inset:-12px}}
#undoBar{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:6px 6px 6px 16px;border-radius:12px;font-weight:600;z-index:61;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px #0006}
#undoBar button{background:var(--accent);color:#fff;border:0;font-weight:700}
.kd.on{background:#fff;box-shadow:0 0 0 2px var(--accent)}
h4.sec{font-size:12.5px;margin:18px 0 8px}
.trb{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -1px;border-radius:7px;padding:0;justify-content:center;font-size:12px;z-index:4;background:var(--panel);color:var(--text);border:1.5px solid var(--accent)}
.clip .vw{position:absolute;left:0;right:0;bottom:0;height:42%;background-color:#0f3b33cc;background-repeat:no-repeat;pointer-events:none;border-top:1px solid #22d3a644}.clip .vw.mute{opacity:.3}
.trb.has{background:var(--accent);color:#fff;border-color:var(--accent)}.trb.on{outline:2px solid var(--ph)}
.tgrid,.flgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.tgrid button,.flgrid button{flex-direction:column;gap:4px;padding:5px 2px;font-size:10.5px;border-radius:9px;min-width:0;justify-content:center}
.tgrid button.on,.flgrid button.on{border-color:var(--accent);background:var(--accent-soft)}
.flgrid span{width:100%;aspect-ratio:1;border-radius:6px;background:#556 center/cover}
.tp{width:100%;aspect-ratio:1.4;border-radius:5px;background:linear-gradient(90deg,#f6a35b 50%,#5ac8fa 50%)}
.tp-none{background:linear-gradient(90deg,#f6a35b 50%,#5ac8fa 50%)}.tp-fade{background:linear-gradient(90deg,#f6a35b,#5ac8fa)}.tp-black{background:linear-gradient(90deg,#f6a35b,#000,#5ac8fa)}.tp-white{background:linear-gradient(90deg,#f6a35b,#fff,#5ac8fa)}
.tp-slideL{background:linear-gradient(90deg,#f6a35b 30%,#5ac8fa 30%)}.tp-slideR{background:linear-gradient(90deg,#5ac8fa 70%,#f6a35b 70%)}.tp-zoom{background:radial-gradient(#f6a35b 30%,#5ac8fa 31%)}.tp-slideU{background:linear-gradient(180deg,#f6a35b 30%,#5ac8fa 30%)}.tp-slideD{background:linear-gradient(180deg,#5ac8fa 70%,#f6a35b 70%)}.tp-wipeL{background:linear-gradient(90deg,#f6a35b 45%,#fff 45%,#fff 50%,#5ac8fa 50%)}.tp-wipeR{background:linear-gradient(90deg,#5ac8fa 50%,#fff 50%,#fff 55%,#f6a35b 55%)}.tp-circle{background:radial-gradient(circle,#5ac8fa 35%,#f6a35b 36%)}.tp-spin{background:conic-gradient(#f6a35b 0 25%,#5ac8fa 0 50%,#f6a35b 0 75%,#5ac8fa 0)}.tp-shake{background:repeating-linear-gradient(90deg,#f6a35b 0 6px,#5ac8fa 6px 12px)}
.tp-blur{background:linear-gradient(90deg,#f6a35b,#5ac8fa);filter:blur(2px)}
.stk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.stk button{font-size:24px;justify-content:center;padding:6px 0;border-radius:10px}
#pSp{margin:8px 0 4px}
.tbar button.warn{background:#ff3b5c;color:#fff;border-color:#ff3b5c}
#recPill{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:#ff3b5c;color:#fff;border:0;border-radius:20px;padding:7px 16px;font-weight:700;z-index:5;box-shadow:0 6px 18px #ff3b5c66;animation:recP 1.3s ease-in-out infinite}
@keyframes recP{50%{box-shadow:0 0 0 8px #ff3b5c22}}
.slviz{display:block;width:100%;height:60px;background:var(--panel2);border-radius:8px;border:1px solid var(--line)}
.item .ovl{position:absolute;bottom:4px;right:30px;width:22px;height:22px;border-radius:6px;background:var(--accent2);color:#04261d;display:grid;place-items:center;font-weight:800}
.clip.ovc{border-color:#22d3a6aa}
#home{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.hwrap{flex:1;overflow-y:auto;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.hwrap>*{max-width:980px;margin-inline:auto}
.htop{display:flex;align-items:center;gap:8px;padding:4px 0 12px}
#homeBody h1{font-size:24px;margin:0}
.hero{border-radius:22px;padding:22px 20px;background:linear-gradient(140deg,var(--accent),var(--pink));color:#fff;position:relative;overflow:hidden;margin-bottom:6px}
.hero h2{margin:0;font-size:22px;font-weight:800}.hero p{margin:4px 0 14px;opacity:.9}
.hero .nb{background:#fff;color:#2b1a66;font-weight:800;padding:11px 20px;border-radius:12px;border:0;font-size:15px}
.hero .nb2{background:#ffffff26;color:#fff;border:1px solid #ffffff55;padding:11px 16px;border-radius:12px}
.hero .dc{position:absolute;left:-6px;bottom:-26px;font-size:110px;opacity:.16;pointer-events:none}
.hsec{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}.hsec b{font-size:15px}
.lnk{background:none;border:0;color:var(--mute)}
.recent{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.rc{flex:0 0 auto;width:96px;flex-direction:column;align-items:stretch;padding:0;background:none;border:0;gap:5px;text-align:right}
.rc i{display:block;height:130px;border-radius:14px;background:var(--panel2) center/cover;position:relative;border:1px solid var(--line)}
.rc i.r-16-9,.rc i.r-1-1{background-size:contain;background-repeat:no-repeat;background-color:#000}
.rc em,.pth em{position:absolute;bottom:5px;left:5px;background:#000b;color:#fff;font-size:10px;padding:1px 5px;border-radius:5px;font-style:normal;font-family:var(--mono)}
.rc small{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:12px 8px}
.tg button{flex-direction:column;gap:6px;background:none;border:0;font-size:11.5px;padding:0;position:relative}
.tg button i{width:54px;height:54px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:22px;font-style:normal}
.tg .new::after{content:"جديد";position:absolute;top:-6px;right:calc(50% - 32px);background:var(--accent2);color:#04261d;font-size:9px;font-weight:800;padding:1px 5px;border-radius:5px}
.srch{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--text);font:inherit;margin-bottom:10px}
.pr{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);position:relative}
.pth{width:64px;height:86px;border-radius:10px;flex-shrink:0;position:relative;padding:0;background:var(--panel2) center/contain no-repeat;background-color:#000}
.pr .pt{flex:1;min-width:0}.pr .pt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pr .pt small{color:var(--mute);font-size:11px;display:block;margin-top:3px}
.pr .pt em{font-style:normal;font-size:10px;background:var(--accent-soft);color:var(--chip-on);padding:1px 7px;border-radius:5px;display:inline-block;margin-top:6px}
.pr .pt input{width:100%;background:var(--panel2);border:1px solid var(--accent);border-radius:8px;color:var(--text);font:inherit;padding:6px 8px}
.pr .dots{background:none;border:0;font-size:20px;color:var(--mute);padding:6px 10px}
.pmenu{position:absolute;left:0;top:52px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;width:170px;box-shadow:0 12px 30px #0008;z-index:5;display:flex;flex-direction:column}
.pmenu button{background:none;border:0;justify-content:flex-start;padding:9px 10px;border-radius:8px}.pmenu button:hover{background:var(--panel2)}.pmenu .del{color:#ff5c8a}
.setr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.setr b{display:block}.setr small{color:var(--mute)}
.hnav{display:flex;justify-content:space-around;background:var(--panel);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.hnav button{flex-direction:column;gap:1px;background:none;border:0;color:var(--mute);font-size:11px;padding:4px 18px}.hnav b{font-size:19px;font-weight:400}.hnav .on{color:var(--text)}.hnav .on b{color:var(--accent)}
#homeBtn{font-size:16px;padding:6px 10px}
#tour{position:fixed;inset:0;z-index:70}
#tourSpot{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.66),0 0 0 3px var(--accent),0 0 24px var(--accent);transition:all .25s;pointer-events:none}
#tourTip{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 20px 50px #000a;transition:top .25s,left .25s}
#tourTip b{font-size:16px}#tourTip p{color:var(--mute);line-height:1.8;margin:6px 0 12px}
.tth{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:12px;margin-bottom:4px}.tth button{background:none;border:0;color:var(--mute);padding:2px 4px}
.ttf{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tdots{display:flex;gap:4px}.tdots i{width:6px;height:6px;border-radius:6px;background:var(--line)}.tdots i.done{background:var(--accent)}.tdots i.on{width:16px;background:var(--accent)}
@media (prefers-reduced-motion:reduce){#tourSpot,#tourTip{transition:none}}
.cl{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;background:var(--panel2)}
.cl.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.cl.now{background:var(--accent-soft)}
.clh{display:flex;align-items:center;gap:4px;margin-bottom:6px;flex-wrap:wrap}.clh .sp{flex:1}
.cn{min-width:20px;height:20px;border-radius:6px;background:var(--line);display:grid;place-items:center;font-size:10px}
.ct{padding:2px 7px;font-size:10px}.ctime{width:56px;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:11px;padding:3px 4px;direction:ltr;text-align:center}
.cto{color:var(--mute);font-size:10px}.cb{padding:2px 6px;font-size:12px}.cb.act{background:var(--accent);border-color:var(--accent);color:#fff}.cb.del{color:#ff5c8a}

<script>
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const RATIOS={'9:16':[720,1280],'16:9':[1280,720],'1:1':[900,900],'4:5':[864,1080]};
const FONTS=[['Cairo','كايرو'],['Tajawal','تجوال'],['Amiri','أميري'],['Reem Kufi','ريم كوفي'],['Changa','تشانجا']];
const COLORS=['#ffffff','#ffd36e','#ff5c8a','#7c5cff','#22d3a6','#5ac8fa','#000000'];
const media=new Map();
let P={ratio:'9:16',main:[],texts:[],audios:[],overlays:[]};
let sel=null,time=0,playing=false,t0=0,pps=70,hist=[],fut=[],exporting=null;
let actx=null,adest=null,dl=null;
if(window.claude&&claude.use)claude.use('downloads').then(x=>dl=x).catch(()=>{});

const cv=$('#cv'),g=cv.getContext('2d');
function undoBar(msg){let b=$('#undoBar');if(b)b.remove();b=document.createElement('div');b.id='undoBar';b.innerHTML=`<span>${msg}</span><button>↶ تراجع</button>`;b.querySelector('button').onclick=()=>{undo();b.remove()};document.body.appendChild(b);clearTimeout(undoBar._h);undoBar._h=setTimeout(()=>b.remove(),5000)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200)}
function fmt(t,cs=true){t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t%60),c=Math.floor((t%1)*100);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+(cs?'.'+String(c).padStart(2,'0'):'')}

/* ---------- project model ---------- */
const dur=c=>(c.out-c.in)/(c.speed||1);
const mtime=(c,local)=>c.in+local*(c.speed||1);

  }

}

async function startFromFiles(files){
  if(!files.length)return;await createProject();const list=await addFiles(files);if(!list.length){showHome();return toast('ما قدرنا نفتح الملفات اللي اخترتها')}
  const vis=list.filter(m=>m.type!=='audio');if(vis[0])setRatio(bestRatio(vis[0]),false);
  time=0;for(const m of vis)addToTimeline(m);for(const m of list.filter(m=>m.type==='audio')){time=0;addToTimeline(m)}
  time=0;sel=null;refresh();saveProject(true);
  const first=vis.find(m=>m.type==='video')||list[0];if(pendingTool)runPendingTool(first);
}
$('#newFile').addEventListener('change',e=>{const f=[...e.target.files];if(f.length)startFromFiles(f);else pendingTool=null});
function runPendingTool(m){
  const tool=pendingTool;pendingTool=null;if(!tool||!m)return;
  const c=P.main.find(c=>c.mid===m.id),a=P.audios.find(x=>x.mid===m.id);if(c)sel={k:'m',id:c.id};else if(a)sel={k:'a',id:a.id};refresh();
  const s=getSel();if(!s)return;
  if(tool==='cap'){if(m.type!=='image')autoCaption(s,sel.k);return}
  if(tool==='ext'&&m.type==='video'){extractAudio(s);return}
  if(tool==='ovl'){toast('اضغط ⧉ على أي فيديو أو صورة في الوسائط عشان تحطها فوق الفيديو');openSheet('lib');return}
  if(tool==='kf'){kfToggle();return}
  openSheet('props');const id={sil:'slThr',voice:'pCap',fx:'pFxI'}[tool];setTimeout(()=>{const e=tool==='voice'?document.querySelector('[data-voice]'):tool==='fx'?document.querySelector('[data-fx]'):$('#'+id);if(e)e.scrollIntoView({block:'center',behavior:'smooth'})},120);
}

/* ---------- guided tour ---------- */

  [['#cv'],'المعاينة','هنا تشوف الفيديو. تقدر تسحب النص أو الطبقة بإصبعك عشان تغيّر مكانها.'],
  [['#play'],'▶ تشغيل','شغّل وأوقف الفيديو. على الكمبيوتر تقدر تستخدم زر المسافة.'],
  [['#scroll'],'الخط الزمني','كل مسار له نوع: نص، طبقة، فيديو، صوت. اسحب طرف المقطع عشان تقصه، واسحب المقطع كامل عشان تغيّر ترتيبه. اضغط على المسطرة عشان تروح لأي وقت.'],
  [['#split'],'✂ تقسيم','حط المؤشر الأبيض في المكان اللي تبيه واضغط هنا، ويتقسم المقطع لجزئين. بعدها تقدر تحذف جزء، أو تضغط ⇄ بينهم وتحط انتقال.'],
  [['#addText'],'T نص','يضيف نص فوق الفيديو. تقدر تغيّر الخط واللون والحركة، وترفع خط من جهازك.'],
  [['#addSound'],'♫ صوت','موسيقى ومؤثرات جاهزة، وتقدر تستخرج الصوت من أي فيديو.'],
  [['#capBtn'],'📝 كتابة تلقائية','يسمع الكلام اللي في الفيديو ويكتبه نصوص بتوقيتها. بعدها تعدّل الأسطر من قائمة النصوص.'],
  [['#kfBtn'],'◆ كي فريم','يخليك تحرّك العنصر من مكان لمكان. حط كي فريم، روح لوقت ثاني، وغيّر المكان أو الحجم.'],
  [['#props','#mProps'],'⚙ الخصائص','لما تضغط على أي مقطع تطلع إعداداته هنا: السرعة، مغيّر الصوت، حذف الصمت، الفلاتر، التأثيرات، والقص.'],
  [['#exportBtn'],'⬇ تصدير','لما تخلص، اضغط هنا ويطلع لك الفيديو جاهز للحفظ.'],
  [['#homeBtn'],'⌂ الرئيسية','ترجعك لقائمة مشاريعك. كل شي ينحفظ تلقائياً، فتقدر ترجع تكمل أي وقت.']];
let tourI=-1;
function visibleEl(list){for(const q of list){const e=$(q);if(!e)continue;const r=e.getBoundingClientRect();if(r.width>4&&r.height>4&&r.bottom>0&&r.top<innerHeight&&getComputedStyle(e).visibility!=='hidden')return e}return null}
function startTour(){closeSheets();hideHome();tourI=0;showTour()}
function endTour(){tourI=-1;$('#tour').hidden=true;try{localStorage.setItem('laqta-tour','1')}catch(e){}}
function showTour(){
  if(tourI<0)return;if(tourI>=TOUR.length)return endTour();
  const [qs,title,text]=TOUR[tourI],el=visibleEl(qs);if(!el){tourI++;return showTour()}
  const r=el.getBoundingClientRect(),pad=6,sp=$('#tourSpot'),tip=$('#tourTip');$('#tour').hidden=false;
  Object.assign(sp.style,{left:r.left-pad+'px',top:r.top-pad+'px',width:r.width+pad*2+'px',height:r.height+pad*2+'px'});
  tip.innerHTML=`<div class="tth"><span>الخطوة ${tourI+1} من ${TOUR.length}</span><button id="tSkip">✕ تخطي</button></div><b>${title}</b><p>${text}</p>
    <div class="ttf"><span class="tdots">${TOUR.map((_,i)=>`<i class="${i===tourI?'on':i<tourI?'done':''}"></i>`).join('')}</span><span class="row">${tourI?'<button id="tPrev">السابق</button>':''}<button class="primary" id="tNext">${tourI===TOUR.length-1?'خلصنا ✓':'التالي ←'}</button></span></div>`;
  const W=Math.min(340,innerWidth-24);tip.style.width=W+'px';const th=tip.offsetHeight;
  let top=r.bottom+14;if(top+th>innerHeight-10)top=r.top-th-14;if(top<10)top=Math.max(10,Math.min(innerHeight-th-10,r.top+r.height/2-th/2));
  tip.style.top=top+'px';tip.style.left=clamp(r.left+r.width/2-W/2,12,innerWidth-W-12)+'px';
  $('#tSkip').onclick=endTour;$('#tNext').onclick=()=>{tourI++;showTour()};const pv=$('#tPrev');if(pv)pv.onclick=()=>{tourI--;showTour()};$('#tNext').focus();
}
addEventListener('resize',()=>{if(tourI>=0)showTour()});
document.addEventListener('keydown',e=>{if(tourI<0)return;if(e.key==='Escape')endTour();else if(e.key==='ArrowLeft'){tourI++;showTour()}else if(e.key==='ArrowRight'&&tourI>0){tourI--;showTour()}},true);

/* ---------- captions list ---------- */
let propsMode=null;
const caps=()=>P.texts.filter(t=>t.caption).sort((a,b)=>a.start-b.start);
function parseT(v){v=String(v).trim().replace(',','.');const m=v.match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);return m?(+(m[1]||0))*60+ +m[2]:NaN}
function openCaps(){sel=null;propsMode='caps';refresh();openSheet('props')}
function renderCaps(el){
  const L=caps(),x='<button class="mob sheet-x" data-close>✕</button>';
  el.innerHTML=`<h3>📝 قائمة النصوص <small>${L.length} سطر</small> ${x}</h3>
  <div class="row" style="margin-bottom:10px"><button class="primary" id="cAdd">＋ سطر جديد</button><button id="cMerge" title="دمج السطر المحدد مع اللي بعده">⇅ دمج</button><button id="cClose">رجوع</button></div>
  ${L.length?`<div class="field"><span class="lab">🎨 نمط موحد لكل الأسطر</span><div class="presets">${PRESETS.map(([n,p],i)=>`<button data-cpre="${i}" style="font-family:'${p.font}';color:${p.color};${p.bg?`background:${p.bgColor};`:''}${p.stroke?`-webkit-text-stroke:1px ${p.strokeColor};`:''}${p.glow?`text-shadow:0 0 8px ${p.color};`:''}">${n}</button>`).join('')}</div></div>
  <div class="field"><span class="lab">🔤 كلمة بكلمة للكل</span><div class="chips">${KARA.map(([k,n])=>`<button data-ckara="${k}" class="${(L[0].kara||'none')===k?'on':''}">${n}</button>`).join('')}</div></div>
  <div class="field"><label for="cSize">حجم الخط للكل · <span id="cSizeV">${L[0].size}</span></label><input type="range" id="cSize" min="16" max="${Math.round(cv.width*.12)}" value="${L[0].size}"></div>
  <p class="hint" style="margin:0 0 10px">اضغط ▶ عشان تروح للسطر. اكتب الوقت بالشكل 0:12.5. ⬆ يحط السطر فوق الشاشة، و⬇ يرجعه تحت.</p>`:'<p class="hint">ما فيه أسطر للحين. استخدم «📝 كتابة تلقائية» أو اضغط «＋ سطر جديد».</p>'}
  <div id="cList">${L.map((t,i)=>`<div class="cl${sel&&sel.id===t.id?' sel':''}" data-cid="${t.id}"><div class="clh"><span class="cn">${i+1}</span><button class="ct" data-cgo="${t.id}" title="روح للسطر">▶</button>
    <input class="ctime" data-cs="${t.id}" value="${fmt(t.start).replace(/^00:/,'0:')}" aria-label="البداية"><span class="cto">←</span><input class="ctime" data-ce="${t.id}" value="${fmt(t.start+t.dur).replace(/^00:/,'0:')}" aria-label="النهاية">
    <span class="sp"></span><button class="cb${t.y<.5?' act':''}" data-cup="${t.id}" title="فوق الشاشة">⬆</button><button class="cb${t.y>=.5?' act':''}" data-cdn="${t.id}" title="تحت الشاشة">⬇</button><button class="cb del" data-cdel="${t.id}" title="حذف">🗑</button></div>
    <textarea data-ctx="${t.id}" dir="rtl" aria-label="نص السطر">${esc(t.text)}</textarea></div>`).join('')}</div>`;
  const byId=id=>P.texts.find(t=>t.id===id);
  $('#cAdd').onclick=()=>{commit();const prev=caps()[0];const t=norm({...(prev?JSON.parse(JSON.stringify(prev)):{size:Math.round(cv.width*.055),color:'#ffffff',font:'Tajawal',weight:700,x:.5,y:.82,bg:true,bgColor:'rgba(0,0,0,.62)',shadow:0,ain:'fade',aout:'fade'}),id:uid(),text:'سطر جديد',start:+time.toFixed(2),dur:2,caption:true,kf:[],y:.82});P.texts.push(t);sel={k:'t',id:t.id};refresh();setTimeout(()=>{const ta=document.querySelector(`[data-ctx="${t.id}"]`);if(ta){ta.focus();ta.select();ta.scrollIntoView({block:'center'})}},50)};
  $('#cMerge').onclick=()=>{const L2=caps(),i=L2.findIndex(t=>sel&&t.id===sel.id);if(i<0||i>=L2.length-1)return toast('اختر سطر عشان تدمجه مع اللي بعده');commit();const a=L2[i],b=L2[i+1];a.text=a.text+' '+b.text;a.dur=b.start+b.dur-a.start;P.texts.splice(P.texts.indexOf(b),1);refresh()};
  $('#cClose').onclick=()=>{propsMode=null;sel=null;refresh()};
  el.querySelectorAll('[data-ckara]').forEach(b=>b.onclick=()=>{commit();caps().forEach(t=>t.kara=b.dataset.ckara);refresh()});
  el.querySelectorAll('[data-cpre]').forEach(b=>b.onclick=()=>{commit();const pr=PRESETS[+b.dataset.cpre][1];caps().forEach(t=>Object.assign(t,pr));refresh();toast('تم تطبيق النمط على كل الأسطر')});
  const cs=$('#cSize');if(cs){let c=0;cs.addEventListener('input',e=>{if(!c){commit();c=1}caps().forEach(t=>t.size=+e.target.value);$('#cSizeV').textContent=e.target.value})}
  el.querySelectorAll('[data-cgo]').forEach(b=>b.onclick=()=>{const t=byId(b.dataset.cgo);pause();seek(t.start+.01);sel={k:'t',id:t.id};refresh()});
  el.querySelectorAll('[data-cs],[data-ce]').forEach(inp=>inp.onchange=()=>{const t=byId(inp.dataset.cs||inp.dataset.ce),v=parseT(inp.value);if(isNaN(v)){toast('اكتب الوقت مثل 0:12.5');return refresh()}commit();
    if(inp.dataset.cs){const end=t.start+t.dur;t.start=clamp(v,0,end-.2);t.dur=end-t.start}else t.dur=Math.max(.2,v-t.start);refresh()});
  el.querySelectorAll('[data-cup],[data-cdn]').forEach(b=>b.onclick=()=>{commit();const t=byId(b.dataset.cup||b.dataset.cdn);t.y=b.dataset.cup?.15:.82;if(t.kf&&t.kf.length)t.kf.forEach(k=>k.y=t.y);refresh()});
  el.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>{commit();const t=byId(b.dataset.cdel);P.texts.splice(P.texts.indexOf(t),1);if(sel&&sel.id===t.id)sel=null;refresh()});
  el.querySelectorAll('[data-ctx]').forEach(ta=>{ta.addEventListener('focus',()=>{commit();sel={k:'t',id:ta.dataset.ctx};document.querySelectorAll('.cl.sel').forEach(c=>c.classList.remove('sel'));ta.closest('.cl').classList.add('sel')});ta.addEventListener('input',()=>{byId(ta.dataset.ctx).text=ta.value;renderTimeline()})});
}
let capTick=0;
function capHighlight(){if(propsMode!=='caps'||performance.now()-capTick<200)return;capTick=performance.now();document.querySelectorAll('#cList .cl').forEach(c=>{const t=P.texts.find(x=>x.id===c.dataset.cid);c.classList.toggle('now',!!t&&time>=t.start&&time<t.start+t.dur)})}

(async function init(){
  $('#ratioTop').innerHTML=ratioBtns();setRatio('9:16',false);renderLib();refresh();
  requestAnimationFrame(loop);
  for(const f of await DB.all('fonts').catch(()=>[])){try{const ff=new FontFace(f.fam,f.buf.slice(0));await ff.load();document.fonts.add(ff);customFonts.push([f.fam,f.label,true])}catch(e){}}
  await migrate().catch(()=>{});
  showHome();endSplash();checkUpdate();
  if(document.fonts)FONTS.forEach(([f])=>document.fonts.load(`700 40px "${f}"`));
})();
</script>
