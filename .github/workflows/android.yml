name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Keep Android's debug signing key between builds so each new APK installs as an update.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: laqta-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle the web app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
      - name: Load signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.LAQTA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/laqta.keystore"
            echo "LAQTA_KEYSTORE_PATH=$RUNNER_TEMP/laqta.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: android
        env:
          LAQTA_KEYSTORE_PASSWORD: ${{ secrets.LAQTA_KEYSTORE_PASSWORD }}
          LAQTA_KEY_ALIAS: ${{ secrets.LAQTA_KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk laqta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: laqta-apk
          path: laqta.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: لقطة 1.0.${{ github.run_number }}
          body_path: android/whatsnew.txt
          files: laqta.apk
          make_latest: true
